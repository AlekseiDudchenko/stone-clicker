<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stone Clicker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <main class="game" aria-label="Stone Clicker">
        <header class="stats">
          <output id="stone-count" class="counter" aria-live="polite">Stones: 0</output>
          <p id="stone-rate" class="rate">per second: 0</p>
          <p id="click-power" class="click-power">per click: 1</p>
        </header>

        <button id="stone" class="stone" type="button" aria-label="Collect stones"></button>

        <p id="total-stats" class="total-stats"></p>
      </main>

      <aside class="shop" aria-label="Shop">
        <section class="shop__section">
          <h2 class="shop__title">Upgrades</h2>
          <div id="upgrades" class="upgrades"></div>
          <p id="upgrades-empty" class="shop__empty">Keep digging to unlock upgrades.</p>
        </section>

        <section class="shop__section">
          <h2 class="shop__title">Buildings</h2>
          <div id="buildings" class="buildings"></div>
        </section>

        <section class="shop__section">
          <h2 class="shop__title">Prizes <span id="prizes-count" class="shop__count"></span></h2>
          <div id="prizes" class="prizes"></div>
        </section>

        <section class="shop__section">
          <h2 class="shop__title">Themes</h2>
          <div id="themes" class="themes"></div>
        </section>

        <button id="reset" class="reset" type="button">Reset progress</button>
      </aside>
    </div>

    <div id="toasts" class="toasts"></div>

    <script src="themes.js"></script>
    <script src="prizes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
